title: Encoded PowerShell Command Execution
id: TODO-UUID
description: >
    Detects PowerShell executing a base64-encoded command, identified via the
    binary's PE metadata rather than its filename on disk. Encoded commands
    conceal script content from command-line logging and are a common carrier
    for in-memory download cradles (IEX + Net.WebClient), where no payload is
    written to disk and file-based controls have no visibility. Keying on
    OriginalFileName rather than Image means a renamed or relocated PowerShell
    binary still matches.
references: 
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
  - https://lolbas-project.github.io/lolbas/Binaries/Powershell/
author: Aaquib
date: 2024-06-19
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection_binary:
    OriginalFileName:
      - 'PowerShell.EXE' 
      - 'pwsh.dll'
  selection_encoded:
    CommandLine| re:
      - '\s-[eE][ncodedmalsCP]*\s+[A-Za-z0-9+/=]{15,}'
  condition: all of selection_*
falsepositives:
  - Software deployment tooling (SCCM, PDQ) invoking encoded payloads from batch wrappers
  - Legitimate administrative scripts that use encoded commands for obfuscation or to avoid command-line length limitations
  - Backup and monitoring agents that wrap PowerShell in cmd for scheduling
level: medium
status: experimental

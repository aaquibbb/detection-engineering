title: Browser Credential Store Copied Outside Profile Directory
id: bf2298fb-3337-40c5-886b-a71e7cb9878b
status: experimental
description: >
     Detects browser based credential theft by monitoring for the copying of browser credential stores outside of the user profile directory. This technique is often used by malware to exfiltrate sensitive information such as saved passwords and cookies from browsers like Chrome and Firefox. The detection focuses on identifying when files like 'Login Data', 'Cookies', 'Logins.json', and 'key4.db' are copied to locations outside of their expected directories, which may indicate malicious activity.
references:
    - https://attack.mitre.org/techniques/T1555/003/
    - https://www.darktrace.com/blog/when-ai-becomes-the-lure-a-fake-gemini-installer-delivers-vidar
author: Aaquib
date: 2026/08/26
tags:
    - attack.credential-access
    - attack.t1555.003
logsource:
    category: file_event
    product: windows
detection:
    select_file:
      TargetFilename|endswith:
        - '\Login Data'
        - '\Cookies'
        - '\Logins.json'
        - '\key4.db'
    Filter_browser_dirs:
      TargetFilename|contains:
        - '\User Data\'
        - '\Mozilla\Firefox\Profiles\'
    condition: select_file and not Filter_browser_dirs
falsepositives:
  - Forensic investigations where browser credential stores are copied for analysis
  - Backup and monitoring agents that access credentials for backup or monitoring purposes
level: medium

